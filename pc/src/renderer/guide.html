<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
  <title>Guia — NFSU2</title>
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="guide.css">
</head>
<body>
  <header class="titlebar">
    <img class="appicon" src="icon.png" alt="">
    <span class="title" id="g-title">Guia</span>
    <button class="cap" id="p-dock" title="Recolher para a borda da tela (passe o mouse lá para reabrir)" aria-label="Recolher">&#xE921;</button>
    <button class="cap close" id="p-close" title="Fechar" aria-label="Fechar">&#xE8BB;</button>
  </header>
  <div class="toolbar">
    <div id="g-pick" class="seg" role="group" aria-label="Escolher guia"></div>
    <span class="spacer"></span>
    <button id="g-mode" class="btn" title="Alternar entre passo a passo e a lista completa">Ver tudo</button>
    <button id="g-tips" class="btn" title="Voltar à tela de Dicas do app">Dicas</button>
    <button id="g-lang" class="btn" title="Português / English">EN</button>
    <span class="fontsz" role="group"><button id="g-font-dn" class="btn" title="Diminuir a letra">A−</button><button id="g-font-up" class="btn" title="Aumentar a letra">A+</button></span>
    <label class="op" title="Transparência da janela"><span>◐</span><input id="p-op" type="range" min="0.3" max="1" step="0.05" value="0.75"><span id="p-op-v" class="opv">75%</span></label>
  </div>

  <main id="g-step" class="step">
    <div class="meta"><span id="g-part"></span><span id="g-count"></span></div>
    <div class="progress"><i id="g-bar"></i></div>
    <p id="g-text" class="text"></p>
    <div class="actions">
      <button id="g-prev" class="btn">Anterior</button>
      <button id="g-done" class="btn accent">Feito</button>
      <button id="g-next" class="btn accent" hidden></button>
    </div>
  </main>

  <main id="g-list" class="list" hidden></main>
  <div id="p-grip" class="grip wide" title="Arraste para mudar a largura (a altura se ajusta ao texto)"></div>
  <script src="tips.js"></script>
  <script src="panel.js"></script>
  <script src="guide.js"></script>
</body>
</html>
